<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人主页</title>
  <meta name="description" content="成都大学工商管理专业大三学生个人介绍">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <!-- ============ 顶部导航 ============ -->
  <header class="header">
    <div class="container">
      <a class="brand" href="index.html">
        <strong data-key="profile.name"></strong>
        <small data-key="profile.enName"></small>
      </a>

      <nav class="nav-menu" id="navMenu">
        <a data-nav="home" href="#profile">基本信息</a>
        <a href="#intro">个人简介</a>
        <a href="#skills">能力结构</a>
        <a href="#record">成长经历</a>
        <a data-nav="website" href="website.html">我的网站</a>
        <a href="#contact">联系</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" type="button" title="切换深色 / 浅色"></button>
        <button class="icon-btn" id="editToggle" type="button" title="开启 / 关闭编辑模式">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>
        </button>
        <button class="icon-btn" id="navToggle" type="button" title="菜单">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ 第一部分：姓名与基本信息 ============ -->
  <section class="hero" id="profile">
    <div class="container hero-grid">
      <div>
        <span class="eyebrow">个人简历 · <b data-key="profile.school"></b></span>
        <h1 class="hero-name" data-key="profile.name"></h1>
        <p class="hero-en" data-key="profile.enName"></p>
        <div class="hero-divider"></div>
        <p class="hero-title" data-key="profile.title"></p>
        <p class="hero-tagline" data-key="profile.tagline"></p>

        <dl class="info-table" data-list="basic" data-item="infoRow"></dl>

        <div class="hero-actions">
          <a class="btn btn-primary" href="website.html">
            我的网站作品
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
          </a>
          <a class="btn btn-ghost" href="#contact">联系方式</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 个人简介 ============ -->
  <section class="section" id="intro">
    <div class="container split">
      <div class="reveal">
        <span class="eyebrow">个人简介</span>
        <h2 class="section-title">自我介绍</h2>
        <div class="prose" data-key="profile.intro"></div>
        <p class="muted" style="margin-top:22px">座右铭：<span data-key="profile.motto"></span></p>
      </div>

      <div class="reveal">
        <span class="eyebrow">教育背景</span>
        <div style="display:grid;gap:18px" data-list="education" data-item="education"></div>
      </div>
    </div>
  </section>

  <!-- ============ 成长经历 ============ -->
  <section class="section section-soft" id="record">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">成长经历</span>
        <h2 class="section-title">学习与成长轨迹</h2>
      </div>
      <div class="timeline reveal" data-list="timeline" data-item="timeline"></div>

      <div style="margin-top:52px">
        <span class="eyebrow">荣誉与证书</span>
        <div class="award-grid reveal" data-list="awards" data-item="award"></div>
      </div>
    </div>
  </section>

  <!-- ============ 能力结构 ============ -->
  <section class="section" id="skills">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">能力结构</span>
        <h2 class="section-title">专业知识与技能</h2>
        <p class="section-desc">以工商管理专业为核心，辅以数据分析与技术实践能力。</p>
      </div>

      <div class="skill-grid reveal" data-list="skillGroups" data-item="skillGroup"></div>

      <div class="card reveal" style="margin-top:20px;padding:24px 26px">
        <h3 class="group-title">主修课程</h3>
        <div class="chip-wrap" data-list="courses" data-item="chip"></div>
      </div>
    </div>
  </section>

  <!-- ============ 联系方式 ============ -->
  <section class="section section-soft" id="contact">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">联系方式</span>
        <h2 class="section-title">欢迎与我联系</h2>
        <p class="section-desc" data-key="contact.intro"></p>
      </div>

      <div class="contact-grid reveal">
        <a class="card contact-card" data-hide-if-empty="contact.email" data-key-href="contact.email" data-href-prefix="mailto:" href="#">
          <span class="ci">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          </span>
          <div><span>Email</span><b data-key="contact.email"></b></div>
        </a>

        <div class="card contact-card" data-hide-if-empty="contact.phone">
          <span class="ci">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg>
          </span>
          <div><span>Phone</span><b data-key="contact.phone"></b></div>
        </div>

        <div class="card contact-card" data-hide-if-empty="contact.wechat">
          <span class="ci">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>
          </span>
          <div><span>WeChat</span><b data-key="contact.wechat"></b></div>
        </div>

        <div class="card contact-card" data-hide-if-empty="contact.qq">
          <span class="ci">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/><path d="M9 10h6"/></svg>
          </span>
          <div><span>QQ</span><b data-key="contact.qq"></b></div>
        </div>

        <a class="card contact-card" data-hide-if-empty="contact.github" data-key-href="contact.github" href="#" target="_blank" rel="noopener">
          <span class="ci">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 20c-1-2-1-5 0-6"/></svg>
          </span>
          <div><span>GitHub</span><b data-key="contact.github"></b></div>
        </a>

        <a class="card contact-card" data-key-href="myWebsite.url" href="#" target="_blank" rel="noopener">
          <span class="ci">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>
          </span>
          <div><span>Website</span><b data-key="myWebsite.urlText"></b></div>
        </a>
      </div>
    </div>
  </section>

  <!-- ============ 页脚 ============ -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <p data-key="footer.text"></p>
        <div class="footer-socials">
          <a class="tag" data-key-href="myWebsite.url" data-hide-empty href="#" target="_blank" rel="noopener">我的网站</a>
          <a class="tag" data-key-href="contact.github" data-hide-empty href="#" target="_blank" rel="noopener">GitHub</a>
          <a class="tag" href="#profile">返回顶部</a>
        </div>
      </div>
      <div class="footer-copy">
        © <span id="year"></span> <span data-key="profile.name"></span> · <span data-key="footer.copyright"></span>
      </div>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
